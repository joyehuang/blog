name: Friend link validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.head_ref, 'auto/friend-link-') || github.head_ref == 'feat/friend-link-automation-20260915'
    name: friend-link-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --cwd scripts/friend-links --frozen-lockfile
      - run: bun test
      - run: bun test scripts/friend-links
      - run: bun run build:checked
