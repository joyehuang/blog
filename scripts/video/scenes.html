<script>

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);

const SCENES = [];

});

  const paths = ['a', 'b', 'c'].map((id) => { const p = svg.querySelector('#' + id); p.setAttribute('stroke-dasharray', 340); return p; });
  return (t) => { paths[0].setAttribute('stroke-dashoffset', 0); rv(qq, t, 0.6, 0.6); paths[1].setAttribute('stroke-dashoffset', 340 * (1 - P(t, 1.2, 0.7))); rv(q, t, 2.2, 0.7);

function scenario(id, dur, sc) {
  S(id, dur, (root) => {
    root.append(h('h2', '', `<span class="num">${sc.num}</span>推演：${sc.label}`));
    const bub = R('bubble', h('div', 'who', sc.from), h('div', 'msg', sc.message));
    const pp = pipeline(); pp.wrap.classList.add('reveal'); pp.wrap.style.marginTop = '56px';
    const log = h('div', 'log');
    const rows = sc.steps.map((s, i) => { const r = R('row ' + s.v, h('span', 'n', CP[i].n), h('span', 't', CP[i].t), h('span', 'v', VL[s.v]), h('span', '', s.note)); log.appendChild(r); return r; });
    const out = R('outcome ' + (sc.tone || ''), sc.outcome);
    root.append(bub, pp.wrap, log, out);
    const T0 = 1.6, STEP = 1.35;
    const lastReal = sc.steps.map((s) => s.v !== 'skip').lastIndexOf(true);
    return (t) => {
      rv(bub, t, 0.2, 0.6); fade(pp.wrap, t, 0.9, 0.5); pp.wrap.style.transform = 'none';
      pp.token.style.opacity = P(t, 1.3, 0.3);
      let cur = 0;
      sc.steps.forEach((s, i) => {
        const ts = T0 + i * STEP;
        if (i > lastReal) { // skipped
          const k = P(t, T0 + lastReal * STEP + 0.9, 0.4); pp.nodes[i].badge.className = 'badge skip'; pp.nodes[i].badge.textContent = VL.skip; pp.nodes[i].badge.style.opacity = k; rows[i].style.opacity = k * 0.8; rows[i].style.transform = 'none'; pp.nodes[i].node.className = 'node'; return;
        }
        const arrive = P(t, ts, 0.5);
        if (t >= ts) cur = i;
        const lit = arrive > 0.85 && (i >= lastReal ? true : t < ts + STEP + 0.2);
        pp.nodes[i].node.className = 'node' + (lit || i === lastReal && t > ts ? ' lit' : '') + (P(t, ts + 0.55, 0.2) > 0.5 ? ' v-' + s.v : '');
        pp.nodes[i].badge.className = 'badge ' + s.v; pp.nodes[i].badge.textContent = VL[s.v]; pp.nodes[i].badge.style.opacity = P(t, ts + 0.55, 0.25);
        rv(rows[i], t, ts + 0.6, 0.45, 10);
      });
      const seg = clamp((t - T0) / STEP, 0, lastReal); const i0 = Math.min(lastReal, Math.floor(seg)); const frac = Math.min(1, (seg - i0) * 2.2);
      pp.tokenTo(i0, i0 >= lastReal ? 0 : frac, Math.min(lastReal, i0 + 1));
      const fin = sc.steps[lastReal].v; pp.token.className = 'token' + (t > T0 + lastReal * STEP + 0.5 && fin !== 'pass' ? ' ' + fin : '');
      rv(out, t, T0 + lastReal * STEP + 1.6, 0.6);
    };
  });
}

  cols.append(four, term); root.append(lead, neq, note, cols);
  return (t) => { rv(lead, t, 0.3, 0.6); neq.style.opacity = 1; boxes.forEach((b, i) => rv(b, t, 1.2 + i * 0.3, 0.4, 10)); rv(note, t, 3.0, 0.6); rv(four, t, 4.4, 0.6); rv(term, t, 6.2, 0.6); };
});

  right.append(n1, n2); cols.append(tree, right); root.append(lead, cols);

  return (t) => { rv(lead, t, 0.3, 0.7); rv(tree, t, 1.8, 0.6); ts.forEach((e, i) => { e.style.opacity = P(t, 2.4 + i * 0.45, 0.35); }); rv(n1, t, 5.4, 0.6); rv(n2, t, 6.8, 0.6); };
});

    .map(([a, b, c]) => { const r = R('r', h('span', 'nm', a), h('span', 'cp', b), h('span', 'ds', c)); tests.appendChild(r); return r; });
  const foot = R('lead', '<span style="color:var(--muted);font-size:28px">大部分不需要真的调模型：固定的工具调用、临时数据、模拟消息事件，直接检查授权函数、存储结果和发送次数。<br/>测试不是越多越安全，前提是它验证的仍然是当前的政策。</span>'); foot.style.marginTop = '30px';

/* ---------- driver ---------- */
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const host = document.getElementById('scenes');
const mounted = new Map();
function getScene(i) {
  if (!mounted.has(i)) { const root = h('div', 'scene'); root.dataset.id = SCENES[i].id; host.appendChild(root); const update = SCENES[i].mount(root); mounted.set(i, { root, update }); }
  return mounted.get(i);
}
window.seek = function (T) {
  T = clamp(T, 0, TOTAL - 0.001);
  let acc = 0, idx = 0;
  for (let i = 0; i < SCENES.length; i++) { if (T < acc + SCENES[i].dur) { idx = i; break; } acc += SCENES[i].dur; }
  const t = T - acc, s = SCENES[idx];
  for (const [i, m] of mounted) m.root.classList.toggle('on', i === idx);
  const m = getScene(idx); m.root.classList.add('on');
  m.update(t);
  const FADE = 0.45; m.root.style.opacity = Math.min(P(t, 0, FADE), 1 - P(t, s.dur - FADE, FADE));
  document.getElementById('idx').textContent = `[${String(idx + 1).padStart(2, '0')}/${String(SCENES.length).padStart(2, '0')}] ${s.id}`;
  document.getElementById('progress').style.width = (T / TOTAL * 1920) + 'px';
  return { idx, id: s.id, t };
};
window.TOTAL = TOTAL;
window.SCENE_STARTS = SCENES.reduce((acc, s) => (acc.push((acc.length ? acc[acc.length - 1] : 0) + s.dur), acc), []).map((e, i, a) => ({ id: SCENES[i].id, start: i ? a[i - 1] : 0, dur: SCENES[i].dur }));
/* preview in a normal browser: ?t=12.5 or animate with ?play */
const qs = new URLSearchParams(location.search);
if (qs.has('play')) { const t0 = performance.now() - (parseFloat(qs.get('play')) || 0) * 1000; (function loop() { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); })(); }
else seek(parseFloat(qs.get('t')) || 0);
</script>
